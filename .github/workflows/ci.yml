name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  mcp-servers:
    name: MCP servers (build + test)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [mcp/obsidian-vault, mcp/evidence-pinning]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

  python-skills:
    name: Python skills (agent-eval + deid-reid-harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp/evidence-pinning/package-lock.json

      - name: broadcast — build evidence-pinning-mcp (needed by the evidence-pinning integration tests below)
        working-directory: mcp/evidence-pinning
        run: |
          npm ci
          npm run build

      - name: agent-eval — unit-test the scorer (stdlib unittest)
        run: python skills/agent-eval/scripts/test_score_eval.py

      - name: agent-eval — score example results (smoke)
        run: python skills/agent-eval/scripts/score_eval.py skills/agent-eval/scripts/example_results.jsonl

      - name: agent-eval — verify the regression example trips the gate
        # Self-check: the worked example is designed to fail the gate. Confirm it
        # still does (exit non-zero), so the example can't silently bit-rot.
        run: |
          if python skills/agent-eval/scripts/score_eval.py skills/agent-eval/examples/results_regressed.jsonl \
               --baseline skills/agent-eval/examples/results_baseline.jsonl --fail-on-regression --fail-under 0.85; then
            echo "ERROR: regression example did not trip the gate"; exit 1
          else
            echo "OK: gate correctly caught the regression (exit non-zero)"
          fi

      - name: agent-redteam — score adversarial set with a CI gate
        # Demonstrates the DevSecOps pattern: the scorer exits non-zero if the
        # adversarial pass rate falls below the gate, failing the build.
        run: python skills/agent-redteam/scripts/score_eval.py skills/agent-redteam/examples/adversarial_results.jsonl --fail-under 0.5

      - name: deid-reid-harness — run test suite (stdlib unittest)
        run: python skills/deid-reid-harness/scripts/test_harness.py

      - name: wiki-librarian — check_vault.py regression suite (stdlib unittest)
        run: python skills/wiki-librarian/scripts/test_check_vault.py

      - name: wiki-governor — health_score.py regression suite (stdlib unittest)
        run: python skills/wiki-governor/scripts/test_health_score.py

      - name: wiki-teacher — wiki_teacher.py regression suite (stdlib unittest)
        run: python skills/wiki-teacher/scripts/test_wiki_teacher.py

      - name: broadcast — dedup_store.py regression suite (stdlib unittest)
        run: python skills/broadcast/scripts/test_dedup_store.py

      - name: broadcast — source_registry.py regression suite (stdlib unittest)
        run: python skills/broadcast/scripts/test_source_registry.py

      - name: broadcast — ingest.py regression suite (stdlib unittest)
        run: python skills/broadcast/scripts/test_ingest.py

      - name: broadcast — rank.py regression suite (stdlib unittest)
        run: python skills/broadcast/scripts/test_rank.py

      - name: broadcast — evidence_pinning_client.py regression suite (drives the real built MCP server, stdlib unittest)
        run: python skills/broadcast/scripts/test_evidence_pinning_client.py

      - name: broadcast — evidence.py regression suite (drives the real built MCP server, stdlib unittest)
        run: python skills/broadcast/scripts/test_evidence.py

      - name: broadcast — script_gen.py regression suite (stdlib unittest)
        run: python skills/broadcast/scripts/test_script_gen.py

      - name: broadcast — qa_gate.py regression suite (drives the real built MCP server, stdlib unittest)
        run: python skills/broadcast/scripts/test_qa_gate.py

      - name: broadcast — gemini_retry.py regression suite (stdlib unittest)
        run: python skills/broadcast/scripts/test_gemini_retry.py

      - name: broadcast — audio_synth.py regression suite (stdlib unittest)
        run: python skills/broadcast/scripts/test_audio_synth.py

      - name: broadcast — orchestrate.py regression suite (fully faked wiring, stdlib unittest)
        run: python skills/broadcast/scripts/test_orchestrate.py

      - name: broadcast — distribute.py regression suite (stdlib unittest)
        run: python skills/broadcast/scripts/test_distribute.py

      - name: broadcast — narrate.py regression suite (stdlib unittest)
        run: python skills/broadcast/scripts/test_narrate.py

      - name: broadcast — prune_episodes.py regression suite (real temp dirs, stdlib unittest)
        run: python skills/broadcast/scripts/test_prune_episodes.py
