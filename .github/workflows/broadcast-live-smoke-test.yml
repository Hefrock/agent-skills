name: broadcast live smoke test

# Manually-triggered only — deliberately NOT on push/pull_request. This
# workflow makes real calls to external APIs (PubMed, arXiv, three
# industry RSS feeds, and optionally Gemini's embeddings API), unlike
# ci.yml which stays hermetic and network-free on every push. Running it
# on every commit would make CI flaky on someone else's downtime and burn
# Gemini API quota on every push for no reason — it's a deliberate,
# occasional check, not a merge gate.
on:
  workflow_dispatch:

jobs:
  smoke-test:
    name: Live network smoke test (ingest adapters + embeddings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: broadcast — live smoke test (real network calls)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python skills/broadcast/scripts/live_smoke_test.py

      - name: TEMP — round 1 — diagnose Gemini TTS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python skills/broadcast/scripts/_diagnose_tts.py
